# Alembic configuration for the ABM Audit Portal.
#
# The database URL is NOT hardcoded here - env.py builds it from backend/.env
# so migrations and the running app can never drift onto different databases.
#
#   alembic upgrade head          apply everything
#   alembic downgrade -1          roll back one revision
#   alembic revision --autogenerate -m "..."
#   alembic current               what is applied
#   alembic history               full chain

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# path_separator is set via env.py for cross-platform consistency

# No sqlalchemy.url here on purpose - see env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S